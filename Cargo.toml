[workspace]
resolver = "2"
members = [
    "libs/config",
    "libs/observability",
    "libs/api-types",
    "libs/db",
    "libs/email",
    "libs/ai",
    "libs/auth",
    "services/api",
    "services/payment",
    "services/ai-worker",
]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie", "cookie-private"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "set-header"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "time", "macros"] }

# IDs and time
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "macros", "formatting", "parsing"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
anyhow = "1"
thiserror = "2"

# API docs
utoipa = { version = "5", features = ["axum_extras", "uuid", "time"] }
utoipa-swagger-ui = { version = "8", features = ["vendored"] }

# Config / env
envy = "0.4"
dotenvy = "0.15"
once_cell = "1"

# AI
async-openai = "0.23"

# Email
lettre = { version = "0.11", features = ["tokio1", "smtp-transport", "builder"] }
tera = "1"

# Auth / crypto
argon2 = "0.5"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
async-trait = "0.1"
